# Exemplo de configuração do Fly.io. Troque o nome do app (precisa ser único no Fly).
# Crie o app sem publicar:  fly launch --no-deploy --copy-config
# Segredos NUNCA ficam aqui: use  fly secrets set CHAVE=valor  (veja docs/deploy.md).
app = "assistente-ia-exemplo"
primary_region = "gru"   # São Paulo

[build]
  dockerfile = "Dockerfile"

# Só configuração NÃO secreta. Confira os modelos disponíveis na documentação do provedor.
[env]
  PORT = "3000"
  LLM = "openai"
  OPENAI_MODEL = "gpt-4.1-mini"
  EMBEDDING_MODEL = "text-embedding-3-small"
  RATE_LIMIT_POR_MINUTO = "10"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"   # desliga quando não há tráfego (economia)
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"
