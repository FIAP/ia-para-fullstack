<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat com streaming</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    #conversa { display: flex; flex-direction: column; gap: .75rem; margin-bottom: 1rem; }
    .msg { padding: .6rem .9rem; border-radius: .6rem; white-space: pre-wrap; line-height: 1.4; }
    .user { align-self: flex-end; background: #dbeafe; }
    .assistant { align-self: flex-start; background: #f3f4f6; }
    form { display: flex; gap: .5rem; }
    input { flex: 1; padding: .6rem; font-size: 1rem; }
    button { padding: .6rem 1rem; font-size: 1rem; }
  </style>
</head>
<body>
  <h1>Chat com streaming</h1>
  <div id="conversa"></div>
  <form id="form">
    <input id="pergunta" placeholder="Pergunte algo..." autocomplete="off" required>
    <button>Enviar</button>
  </form>

  <script>
    const conversa = document.getElementById("conversa");
    const form = document.getElementById("form");
    const campo = document.getElementById("pergunta");
    // O histórico agora fica no SERVIDOR; o navegador só guarda o id da sessão.
    let sessaoId = sessionStorage.getItem("sessaoId");
    if (!sessaoId) {
      sessaoId = crypto.randomUUID();
      sessionStorage.setItem("sessaoId", sessaoId);
    }

    function novaMensagem(role, texto = "") {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = texto;
      conversa.appendChild(div);
      return div;
    }

    // Lê o corpo da resposta aos pedaços e interpreta o formato SSE:
    // cada evento é "data: <json>\n\n" e o último é "data: [DONE]".
    async function lerStream(resposta, aoReceberToken) {
      const reader = resposta.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) return;
        // Um pedaço da rede pode trazer meio evento: acumulamos até achar "\n\n".
        buffer += decoder.decode(value, { stream: true });
        const eventos = buffer.split("\n\n");
        buffer = eventos.pop(); // o último pode estar incompleto
        for (const evento of eventos) {
          for (const linha of evento.split("\n")) {
            if (!linha.startsWith("data: ")) continue;
            const dado = linha.slice(6);
            if (dado === "[DONE]") return;
            aoReceberToken(JSON.parse(dado));
          }
        }
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const pergunta = campo.value.trim();
      campo.value = "";
      novaMensagem("user", pergunta);
      const saida = novaMensagem("assistant");

      const r = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessaoId, pergunta }),
      });
      await lerStream(r, (token) => { saida.textContent += token; });
    });
  </script>
</body>
</html>
